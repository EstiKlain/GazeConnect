<!-- app.component.html – מעטפת ראשית -->
<!-- מציג: BoardComponent + GazeOverlay + ScanningMode -->
<!-- ContactsComponent מוצג בתוך BoardComponent כ-sidebar -->

<div class="gc-shell">

  <header class="gc-header" role="banner">
    <span class="gc-header__logo" aria-hidden="true">👁</span>
    <span class="gc-header__title">GazeConnect</span>
  </header>

  <!-- GazeOverlay – תמיד על הכל, z-index 9999 -->
  <gc-gaze-overlay />

  <!-- ScanningMode – indicator קטן בפינה -->
  <gc-scanning-mode />

  <!-- Router outlet – board route -->
  <main class="gc-main" role="main">
    <router-outlet />
  </main>

</div>
